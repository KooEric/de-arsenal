[project]
name = "de-arsenal-workspace"
version = "0.0.0"
description = "DE Arsenal workspace root (not published)"
requires-python = ">=3.11"
dependencies = [
    "arsenal-core",
    "pugio[postgres]",
    "de-gladius",
    "de-hasta",
    "de-ballista",
    "de-arsenal",
    "de-onager",
    "de-scutum",
    "spatha",
    "de-scorpio",
    "de-augur",
    "de-aquila",
    "de-pilum",
    "de-censor",
    "de-vigil",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
arsenal-core = { workspace = true }
pugio = { workspace = true }
de-gladius = { workspace = true }
de-hasta = { workspace = true }
de-ballista = { workspace = true }
de-arsenal = { workspace = true }
de-onager = { workspace = true }
de-scutum = { workspace = true }
spatha = { workspace = true }
de-scorpio = { workspace = true }
de-augur = { workspace = true }
de-aquila = { workspace = true }
de-pilum = { workspace = true }
de-censor = { workspace = true }
de-vigil = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1",
    "testcontainers[postgres]>=4.7",
    # de-ballista[object-store] runtime, so CI type-checks and tests the real
    # conditional-write staging store instead of skipping it.
    "obstore>=0.7",
    # pugio[iceberg] runtime plus a local SQLite catalog, so the Iceberg sink is tested
    # against real Iceberg tables on the local filesystem.
    "pyiceberg[sql-sqlite]>=0.9",
    "fastexcel>=0.11",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
streaming = ["de-hasta"]
distributed = ["de-ballista"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["arsenal_core", "pugio", "gladius", "augur", "aquila", "pilum", "censor", "vigil"]

[tool.pyright]
include = ["packages", "benchmarks", "scripts"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
# packages/*/tests에 같은 basename의 테스트 모듈이 여럿 있다(test_cli.py 등, __init__.py 없음).
# importlib 모드가 파일 경로 기준으로 로드해 충돌 없이 공존시킨다. 커버리지 게이트는 80%.
markers = ["spark: needs pyspark and a Java runtime (CI portable-equivalence job)"]
addopts = "--import-mode=importlib --cov=packages --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# e2e/ drives a live kind cluster from CI; it is exercised by ballista-e2e.yml.
omit = ["*/tests/*", "*/e2e/*"]
