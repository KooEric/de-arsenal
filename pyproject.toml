[project]
name = "de-arsenal-workspace"
version = "0.0.0"
description = "DE Arsenal workspace root (not published)"
requires-python = ">=3.11"
dependencies = ["arsenal-core", "pugio[postgres]", "gladius", "de-arsenal"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
arsenal-core = { workspace = true }
pugio = { workspace = true }
gladius = { workspace = true }
de-arsenal = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1",
    "testcontainers[postgres]>=4.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["arsenal_core", "pugio", "gladius"]

[tool.pyright]
include = ["packages"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
# M1 Task 1 착수 — 커버리지 게이트 80으로 상향 (docs/05-testing-plan.md)
# M3 Task 3.1/3.5 — gladius/tests에 test_spec.py, test_cli.py 추가되며
# arsenal-core/pugio의 동명 테스트 모듈과 basename이 충돌 (tests/에 __init__.py
# 없음). importlib 모드는 파일 경로 기준으로 모듈을 로드해 충돌 없이 공존시킨다.
addopts = "--import-mode=importlib --cov=packages --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["*/tests/*"]
