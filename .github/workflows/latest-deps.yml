name: latest-deps
# `ci` tests the versions pinned in uv.lock. A user running `uv tool install de-arsenal`
# gets the newest releases our version ranges allow instead (DuckDB 2.0 arrived this way
# while the lock still said 1.5). This job resolves those newest versions and runs the
# suite on them. A weekly run catches upstream releases that land between our changes.
on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: latest-deps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no moving major tag)
      - run: uv python install 3.12
      # Re-resolve to the highest allowed versions. The changed lock stays in this runner.
      - run: uv lock --upgrade
      - run: uv sync --locked
      - name: Show the versions under test
        run: uv pip list | grep -iE "^(duckdb|pyarrow|psycopg|fastexcel|pydantic|typer|httpx) "
      - run: uv run --no-sync pytest -p no:cacheprovider
