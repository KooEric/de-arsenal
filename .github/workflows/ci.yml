name: ci
# One run per change: PRs (any base, including stacked PRs) run via
# pull_request; pushes only run on main, where merges land. Previously
# `on: [push, pull_request]` ran every PR commit twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer commit on the same PR supersedes the older run.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no moving major tag)
      - run: uv python install ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run python scripts/check_release_metadata.py
      - run: uv run python scripts/gen_schema_docs.py --check
      - run: uv run pytest

  portable-equivalence:
    # DuckDB <-> Spark equivalence over the LogicalPlan v1 golden corpus.
    # The DuckDB half also runs in `test`; this job adds the Spark half.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no moving major tag)
      - run: uv python install 3.11
      - run: uv sync
      - env:
          BALLISTA_REQUIRE_SPARK: "1"
        run: >-
          uv run --with pyspark==3.5.3 pytest
          packages/ballista/tests/test_portable_equivalence.py
          --no-cov -p no:cacheprovider -rs
