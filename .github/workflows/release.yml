name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to verify or publish"
        required: true
        default: "0.2.2"
        type: string
      publish_package:
        description: "Manual PyPI bootstrap package (none = verify only)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - arsenal-core
          - de-arsenal
          - de-gladius
          - onager
          - pugio
          - de-scorpio
          - scutum
          - spatha

jobs:
  verify-and-build:
    name: Verify and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync
      - name: Validate release metadata
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_version="${{ inputs.version }}"
          else
            release_version="$GITHUB_REF_NAME"
          fi
          uv run python scripts/check_release_metadata.py --tag "$release_version"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run python scripts/gen_schema_docs.py --check
      - run: uv run pytest
      - run: uv build --all-packages
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: verify-and-build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_package != 'none')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Select one package for manual bootstrap
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PUBLISH_PACKAGE: ${{ inputs.publish_package }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          case "$PUBLISH_PACKAGE" in
            arsenal-core) package_prefix="arsenal_core" ;;
            de-arsenal) package_prefix="de_arsenal" ;;
            de-gladius) package_prefix="de_gladius" ;;
            de-scorpio) package_prefix="de_scorpio" ;;
            onager|pugio|scutum|spatha) package_prefix="$PUBLISH_PACKAGE" ;;
            *) echo "Unsupported package: $PUBLISH_PACKAGE" >&2; exit 1 ;;
          esac
          mkdir selected-dist
          find dist -maxdepth 1 -type f -name "${package_prefix}-${RELEASE_VERSION}.*" -exec cp -- {} selected-dist/ \;
          test -n "$(find selected-dist -type f -print -quit)"
          rm -rf dist
          mv selected-dist dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
