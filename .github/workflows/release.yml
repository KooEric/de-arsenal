name: release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-and-build:
    name: Verify and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync
      - run: uv run python scripts/check_release_metadata.py --tag "$GITHUB_REF_NAME"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run python scripts/gen_schema_docs.py --check
      - run: uv run pytest
      - run: uv build --all-packages
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: astral-sh/setup-uv@v3
      - run: uv publish dist/*
