# Spec for the Airflow DAG in ../dags/pugio_transfer_daily.py.
# Each DAG run narrows split to its own day with --start/--end.
name: hive-orders-daily

# Absolute, on a volume every worker mounts. Airflow runs tasks in a temporary working
# directory, so a relative state_dir would be lost after each attempt. Without a shared
# volume the transfer is still correct (replace and merge are idempotent), but a retry
# reruns the Hive export instead of resuming at COPY.
state_dir: /opt/airflow/pugio-state

source:
  engine: hive
  dsn_env: HIVE_DSN              # set by the DAG from the `hive_sales` connection
  query: |
    SELECT order_id, user_id, amount, order_date
    FROM sales.orders
    WHERE status = 'paid'
  settings:
    tez.queue.name: etl
  write_scheme: s3a

split:
  column: order_date
  start: 2026-01-01              # replaced by --start/--end on every DAG run
  end: 2026-01-02
  every: day

staging_path: s3://my-staging-bucket/arsenal

target:
  dsn_env: DW_REDSHIFT_DSN       # set by the DAG from the `dw_redshift` connection
  table: analytics.orders
  iam_role_env: DW_COPY_ROLE     # set by the DAG from the `dw_copy_role_arn` variable
  mode: replace
