# 실전 API 검증 2/5 — Stripe Charges API (docs/reference/api-coverage.md)
#
# 검증 포인트: mode: cursor(`starting_after`), envelope(`record_path: data`),
# `has_more` 시맨틱.
#
# 표현 불가 지점 (api-coverage.md "Stripe" 참고): Stripe의 다음 커서는 응답의
# 최상위 필드가 아니라 "이번 페이지 data 배열의 마지막 원소의 id"다.
# PaginationSpec.cursor_path는 dict dot-path 순회만 지원하고(_dig()가 리스트를
# 만나면 즉시 None을 반환) 리스트 인덱싱이나 "마지막 원소"를 가리킬 수 없다 —
# 그래서 REST 소스로 cursor 모드를 선언하는 대신 Python 탈출구로 페이지네이션
# 자체를 구현한다. record_path/envelope 파싱만 필요하다면(=커서가 필요 없는
# 단일 페이지 조회) REST 소스로도 충분하다.
# 실행: STRIPE_SECRET_KEY=xxx pugio run examples/real-world/stripe.yaml
name: real-world-stripe
source:
  type: python
  target: "pugio_examples.stripe_source:StripeChargesSource"
  options:
    url: https://api.stripe.com/v1/charges
    api_key_env: STRIPE_SECRET_KEY
    page_size: 100
sink:
  type: parquet
  path: ./data/real-world/stripe-charges
