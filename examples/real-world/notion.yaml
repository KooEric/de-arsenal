# 실전 API 검증 4/5 — Notion Search API (docs/reference/api-coverage.md)
# 검증 포인트: mode: cursor(`next_cursor` + `has_more`), 초당 3req rate limit,
# POST 검색 엔드포인트 → RestSourceSpec에 method/body 필드가 필요함을 이 API가
# 판정했다 (M2-H에서 추가, 기본값 GET이라 기존 스펙은 영향 없음).
#
# method: POST일 때 페이지네이션 파라미터(size_param/cursor_param)는 쿼리 문자열이
# 아니라 body의 JSON에 병합되어 실린다 (RestSource.fetch() 참고).
# 실행: NOTION_TOKEN=xxx pugio run examples/real-world/notion.yaml
name: real-world-notion
source:
  type: rest
  url: https://api.notion.com/v1/search
  method: POST
  headers: { Notion-Version: "2022-06-28" }
  body: { filter: { value: page, property: object } }
  pagination:
    mode: cursor
    size_param: page_size
    size: 100
    cursor_param: start_cursor
    cursor_path: next_cursor
    record_path: results
  rate_limit: { rps: 3 }
  auth: { type: static_token, token_env: NOTION_TOKEN }
sink:
  type: parquet
  path: ./data/real-world/notion-search
