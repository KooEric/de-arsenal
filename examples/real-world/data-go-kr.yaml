# 실전 API 검증 3/5 — 공공데이터포털(data.go.kr) (docs/reference/api-coverage.md)
# 검증 포인트: euc-kr 인코딩(레거시 공공기관 API 다수가 여전히 이 인코딩을 쓴다),
# mode: page, 인증키(serviceKey)를 쿼리 파라미터로 전달.
#
# 표현 방식: 별도 "쿼리 파라미터 인증" 필드는 없다 — serviceKey를 url 자체에
# ${...} 치환으로 담는다 (env 치환은 로더가 YAML 텍스트 단계에서 수행하므로
# RestSourceSpec.url은 이미 완성된 문자열을 받는다). API 키가 url 안에 그대로
# 남아 상태 DB/로그에 노출될 수 있다는 점은 api-coverage.md에 기록해 둔다.
# 실행: DATA_GO_KR_KEY=xxx pugio run examples/real-world/data-go-kr.yaml
name: real-world-data-go-kr
source:
  type: rest
  url: "https://apis.data.go.kr/1230000/ad/BidPblancInfoService/getBidPblancListInfoCnstwk?serviceKey=${DATA_GO_KR_KEY}&_type=json"
  pagination: { mode: page, param: pageNo, size_param: numOfRows, size: 100, start_page: 1, record_path: items }
  encoding: euc-kr
sink:
  type: parquet
  path: ./data/real-world/data-go-kr
