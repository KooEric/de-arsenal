# 예제 — REST 증분 수집 (시간 창): "지난 실행 이후 새 데이터만".
#
# unit이 곧 시간 구간 [since, until)이고, 구간마다 페이지네이션을 완주한다. 한 구간을
# 완주하면 워터마크가 그 끝으로 전진해 다음 실행은 거기서 시작한다 — 완료된 구간은
# 다시 열거되지 않으므로 매일 돌려도 비용이 "새 구간"만큼이다.
#
# url/파라미터명은 자리표시자입니다 — 실제 API에 맞춰 바꿔서 쓰세요.
# 실행: pugio run examples/incremental-rest.yaml   (cron/GitHub Actions로 반복 실행)
name: incremental-rest-demo
source:
  type: rest
  url: https://api.example.com/v1/orders
  # 증분은 offset/page에서만 쓸 수 있다 — 전진만 하는 cursor/link는 시간 구간으로
  # 되감을 수 없어서 스펙 로드 시점에 거부된다.
  pagination: { mode: offset, param: offset, size_param: limit, size: 100 }
  incremental:
    since_param: updated_after      # 창 시작을 실어 보낼 파라미터
    until_param: updated_before     # 창 끝 (없으면 시작만 보낸다)
    start: "2026-01-01T00:00:00Z"   # 첫 실행의 시작점. 이후에는 워터마크가 이긴다
    window: 1d                      # 창 크기. 더 신선해야 하면 줄이고 그만큼 자주 실행
    lag: 15m                        # 지금으로부터 이만큼은 아직 건드리지 않는다
    format: iso8601                 # iso8601 | date | epoch_s | epoch_ms
sink:
  # 키 기반 sink면 창이 겹치거나 소스가 같은 행을 다시 줘도 upsert가 흡수한다.
  type: duckdb
  path: ./data/orders.duckdb
  table: orders
  merge_key: [id]
# 증분 파이프라인에서는 block이 옳다: 격리(quarantine)는 워터마크 전진을 막지 못해
# 그 창의 행이 조용히 빠질 수 있다. block은 실행을 세워 워터마크를 붙잡아 둔다.
validate:
  rules:
    - { field: id, not_null: true }
  on_violation: block
