[project]
name = "arsenal-core"
version = "0.1.0"
description = "Shared reliability core for DE Arsenal tools — state, identity, errors, spec, retry"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "tenacity>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arsenal_core"]
