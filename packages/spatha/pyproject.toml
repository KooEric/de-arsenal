[project]
name = "spatha"
version = "0.1.1"
description = "Spatha — deterministic dependency DAG planning"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.7", "scutum>=0.1,<0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatha"]
