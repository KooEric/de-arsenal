[project]
name = "onager"
version = "0.2.0"
description = "Onager — safe local Parquet small-file compaction"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["arsenal-core>=0.2,<0.3", "duckdb>=1.0", "scutum>=0.2,<0.3", "typer>=0.12"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/KooEric/de-arsenal"
Repository = "https://github.com/KooEric/de-arsenal"

[project.scripts]
onager = "onager.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onager"]
