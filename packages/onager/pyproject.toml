[project]
name = "onager"
version = "0.1.1"
description = "Onager — safe local Parquet small-file compaction"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["arsenal-core>=0.1,<0.2", "duckdb>=1.0", "scutum>=0.1,<0.2", "typer>=0.12"]

[project.scripts]
onager = "onager.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onager"]
