[project]
name = "pugio"
version = "0.1.0"
description = "Pugio — 수집·전송. 재개·멱등·인증 갱신이 기본값인 ETL 엔진"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["arsenal-core>=0.1,<0.2", "duckdb>=1.0", "httpx>=0.27", "pyarrow>=17", "typer>=0.12"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/KooEric/de-arsenal"
Repository = "https://github.com/KooEric/de-arsenal"

[project.optional-dependencies]
excel = ["fastexcel>=0.11"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
pugio = "pugio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pugio"]
