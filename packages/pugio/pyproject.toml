[project]
name = "pugio"
version = "0.1.0"
description = "Pugio — 수집·전송. 재개·멱등·인증 갱신이 기본값인 ETL 엔진"
requires-python = ">=3.11"
dependencies = ["arsenal-core", "duckdb>=1.0", "httpx>=0.27", "pyarrow>=17", "typer>=0.12"]

[project.optional-dependencies]
excel = ["fastexcel>=0.11"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
pugio = "pugio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pugio"]
