[project]
name = "de-aquila"
version = "0.4.0"
description = "Aquila — a file-backed data catalog: datasets, schema history, lineage, contracts and tags"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "arsenal-core>=0.4,<0.5",
    "de-scorpio>=0.4,<0.5",
    "pyarrow>=17",
    "pyyaml>=6",
    "typer>=0.12",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/KooEric/de-arsenal"
Repository = "https://github.com/KooEric/de-arsenal"

[project.scripts]
aquila = "aquila.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aquila"]
