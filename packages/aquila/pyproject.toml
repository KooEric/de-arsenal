[project]
name = "de-aquila"
version = "0.6.17"
description = "Aquila — a file-backed data catalog: datasets, schema history, lineage, contracts and tags"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "arsenal-core>=0.6,<0.7",
    "de-scorpio>=0.6,<0.7",
    "pyarrow>=17",
    "pyyaml>=6",
    "typer>=0.12",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
]

[project.optional-dependencies]
# Only needed for `aquila scan --iceberg-uri`; remote Parquet uses pyarrow's own filesystems.
iceberg = ["pyiceberg>=0.8"]

[project.urls]
Homepage = "https://github.com/KooEric/de-arsenal"
Repository = "https://github.com/KooEric/de-arsenal"

[project.scripts]
aquila = "aquila.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aquila"]
