[project]
name = "de-pilum"
version = "0.6.10"
description = "Pilum — reverse ETL: dispatch changed records from Parquet to HTTP endpoints and Slack, once per change"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "arsenal-core>=0.6,<0.7",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/KooEric/de-arsenal"
Repository = "https://github.com/KooEric/de-arsenal"

[project.scripts]
pilum = "pilum.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pilum"]
