[project]
name = "de-ballista"
version = "0.6.15"
description = "Ballista — capability-gated remote execution lifecycle for Gladius plans"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "arsenal-core>=0.6,<0.7",
    "de-gladius>=0.6,<0.7",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
ballista = "ballista.cli:app"

[project.optional-dependencies]
# The v1 base package deliberately has no Spark, Kubernetes, or Iceberg runtime.
# Operators provide a worker image and install the cluster integration they use.
spark-kubernetes = ["kubernetes>=30"]
iceberg = ["pyiceberg>=0.8"]
object-store = [
    "obstore>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ballista"]
