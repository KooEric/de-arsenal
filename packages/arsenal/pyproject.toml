[project]
name = "de-arsenal"
version = "0.7.2"
description = "Arsenal — 원클릭 데이터 스택. 수집→검증→변환→쿼리를 명령 하나로 (pugio+gladius 우산 CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "arsenal-core>=0.7,<0.8",
    "pugio>=0.7,<0.8",
    "de-gladius>=0.7,<0.8",
    "de-scorpio>=0.7,<0.8",
    "typer>=0.12",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
postgres = ["pugio[postgres]"]
excel = ["pugio[excel]"]
redshift = ["pugio[redshift]"]
hive = ["pugio[hive]"]
iceberg = ["pugio[iceberg]"]
dlt = ["pugio[dlt]"]
dbt = ["dbt-duckdb>=1.8,<2"]
streaming = ["de-hasta>=0.7,<0.8"]
distributed = ["de-ballista>=0.7,<0.8"]
catalog = ["de-aquila>=0.7,<0.8"]
dispatch = ["de-pilum>=0.7,<0.8"]

[project.urls]
Homepage = "https://github.com/KooEric/de-arsenal"
Repository = "https://github.com/KooEric/de-arsenal"

[project.scripts]
arsenal = "arsenal.cli:app"
# `uv tool install de-arsenal` (and pipx) put only this package's own commands on PATH.
# Declaring the two tool CLIs here too makes `pugio` and `gladius` usable after that
# install; the pugio and de-gladius packages still ship the same commands on their own.
pugio = "pugio.cli:app"
gladius = "gladius.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arsenal"]
