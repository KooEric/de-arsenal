[project]
name = "de-arsenal"
version = "0.1.0"
description = "Arsenal — 원클릭 데이터 스택. 수집→검증→변환→쿼리를 명령 하나로 (pugio+gladius 우산 CLI)"
requires-python = ">=3.11"
dependencies = ["arsenal-core", "pugio", "gladius", "typer>=0.12"]

[project.scripts]
arsenal = "arsenal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arsenal"]
