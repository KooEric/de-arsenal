[project]
name = "scutum"
version = "0.1.1"
description = "Scutum — Arrow data contracts and validation reports"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["arsenal-core>=0.1,<0.2", "pyarrow>=17", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scutum"]
