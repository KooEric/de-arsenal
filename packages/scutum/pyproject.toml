[project]
name = "de-scutum"
version = "0.3.0"
description = "Scutum — Arrow data contracts and validation reports"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["arsenal-core>=0.3,<0.4", "pyarrow>=17", "pydantic>=2.7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/KooEric/de-arsenal"
Repository = "https://github.com/KooEric/de-arsenal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scutum"]
