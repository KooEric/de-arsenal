[project]
name = "gladius"
version = "0.1.0"
description = "Gladius — 변환·쿼리. map/steps 선언을 SQL로 컴파일해 DuckDB에서 실행"
requires-python = ">=3.11"
dependencies = ["arsenal-core", "duckdb>=1.0", "pyarrow>=17", "typer>=0.12"]

[project.scripts]
gladius = "gladius.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gladius"]
