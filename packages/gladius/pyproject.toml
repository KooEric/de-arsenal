[project]
name = "de-gladius"
version = "0.2.0"
description = "Gladius — 변환·쿼리. map/steps 선언을 SQL로 컴파일해 DuckDB에서 실행"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["arsenal-core>=0.2,<0.3", "duckdb>=1.0", "pyarrow>=17", "typer>=0.12"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/KooEric/de-arsenal"
Repository = "https://github.com/KooEric/de-arsenal"
PyPI = "https://pypi.org/project/de-gladius/"

[project.scripts]
gladius = "gladius.cli:app"

[project.optional-dependencies]
python = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gladius"]
